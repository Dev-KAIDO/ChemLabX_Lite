<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي — ChemLabX 4.0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .profile-page { padding: 32px 20px 60px; max-width: 960px; margin: 0 auto; }
        .profile-hero { display: flex; align-items: center; gap: 20px; padding: 24px; border-radius: 20px; background: linear-gradient(135deg, rgba(var(--accent-green-rgb), 0.12), rgba(var(--accent-blue-rgb), 0.08)); border: 1px solid var(--glass-border); }
        .profile-avatar { width: 74px; height: 74px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-green), var(--accent-blue)); display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 8px 24px rgba(var(--accent-green-rgb), 0.35); }
        .profile-name { font-size: 22px; font-weight: 800; color: var(--text-primary); }
        .profile-meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 22px; }
        .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
        .achievement-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--glass-border); }
        .achievement-card.locked { border-style: dashed; filter: grayscale(1); }
        .achievement-card.locked .achievement-icon { opacity: 0.75; }
        .achievement-icon { font-size: 26px; }
        .achievement-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
        .achievement-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    </style>
    <script>
        (function () {
            var t = localStorage.getItem('chemlabx_theme');
            if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
            var l = localStorage.getItem('chemlabx_lang') || 'ar';
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>
</head>
<body>
    <div id="site-nav"></div>

    <div class="app-wrapper">
        <main class="profile-page" id="profileRoot"></main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/core/i18n.js"></script>
    <script src="js/core/versions.js"></script>
    <script src="js/core/dataport.js"></script>
    <script src="js/core/db.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/data/achievements.js"></script>
    <script src="js/pages/profile.js"></script>
</body>
</html>
