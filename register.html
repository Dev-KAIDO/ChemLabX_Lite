<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب — ChemLabX 4.0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
        (function () {
            var t = localStorage.getItem('chemlabx_theme');
            if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
            var l = localStorage.getItem('chemlabx_lang') || 'ar';
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>
</head>
<body>
    <div class="login-screen">
        <div class="login-bg" aria-hidden="true"></div>
        <canvas id="authCanvas" class="auth-canvas" aria-hidden="true"></canvas>

        <main class="login-card login-card-wide">
            <a href="index.html" class="auth-back" data-ar="← الرئيسية" data-en="← Home">← الرئيسية</a>
            <button type="button" class="btn-lang auth-lang" id="langToggle">EN</button>
            <div class="login-logo" aria-hidden="true">🧪</div>
            <h1 class="login-title" data-ar="أنشئ حسابك" data-en="Create your account">أنشئ حسابك</h1>
            <p class="login-subtitle" data-ar="انضم كطالب أو معلم أو مستخدم مستقل" data-en="Join as a student, teacher or independent user">انضم كطالب أو معلم أو مستخدم مستقل</p>

            <div class="login-form">
                <div class="login-input-group">
                    <input type="text" id="regName" placeholder="الاسم الكامل" aria-label="الاسم الكامل" data-ar-aria-label="الاسم الكامل" data-en-aria-label="Full name" data-ar-placeholder="الاسم الكامل" data-en-placeholder="Full name" maxlength="40" autocomplete="name">
                </div>
                <div class="login-input-group">
                    <input type="email" id="regEmail" placeholder="البريد الإلكتروني" aria-label="البريد الإلكتروني" data-ar-aria-label="البريد الإلكتروني" data-en-aria-label="Email address" data-ar-placeholder="البريد الإلكتروني" data-en-placeholder="Email address" autocomplete="email">
                </div>
                <div class="login-input-group">
                    <input type="password" id="regPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" aria-label="كلمة المرور (6 أحرف على الأقل)" data-ar-aria-label="كلمة المرور (6 أحرف على الأقل)" data-en-aria-label="Password (min 6 characters)" data-ar-placeholder="كلمة المرور (6 أحرف على الأقل)" data-en-placeholder="Password (min 6 characters)" autocomplete="new-password">
                </div>

                <div class="login-input-group">
                    <div class="auth-label" id="roleLabel" data-ar="نوع الحساب" data-en="Account type">نوع الحساب</div>
                    <div class="role-select" id="roleSelect" role="group" aria-labelledby="roleLabel">
                        <button type="button" class="role-opt active" data-role="user" aria-pressed="true">
                            <span class="role-opt-icon" aria-hidden="true">🧑‍🔬</span>
                            <span class="role-opt-name" data-ar="مستخدم مستقل" data-en="Independent">مستخدم مستقل</span>
                            <span class="role-opt-desc" data-ar="استكشف المعمل بنفسك" data-en="Explore on your own">استكشف المعمل بنفسك</span>
                        </button>
                        <button type="button" class="role-opt" data-role="student" aria-pressed="false">
                            <span class="role-opt-icon" aria-hidden="true">🎓</span>
                            <span class="role-opt-name" data-ar="طالب" data-en="Student">طالب</span>
                            <span class="role-opt-desc" data-ar="انضم لفصل واجب معلمك" data-en="Join a class & complete work">انضم لفصل واجب معلمك</span>
                        </button>
                        <button type="button" class="role-opt" data-role="teacher" aria-pressed="false">
                            <span class="role-opt-icon" aria-hidden="true">👨‍🏫</span>
                            <span class="role-opt-name" data-ar="معلم" data-en="Teacher">معلم</span>
                            <span class="role-opt-desc" data-ar="أدر فصلاً وطلاباً وواجبات" data-en="Manage classes & students">أدر فصلاً وطلاباً وواجبات</span>
                        </button>
                    </div>
                </div>

                <div class="login-input-group" id="levelGroup">
                    <select id="regLevel" aria-label="مستوى الخبرة" data-ar-aria-label="مستوى الخبرة" data-en-aria-label="Experience level">
                        <option value="beginner" data-ar="🥉 مبتدئ - مبتدئ في الكيمياء" data-en="🥉 Beginner - Chemistry beginner">🥉 مبتدئ - مبتدئ في الكيمياء</option>
                        <option value="intermediate" data-ar="🥈 متوسط - لديه خلفية أساسية" data-en="🥈 Intermediate - Basic background">🥈 متوسط - لديه خلفية أساسية</option>
                        <option value="advanced" data-ar="🥇 متقدم - خبرة في المختبر" data-en="🥇 Advanced - Lab experience">🥇 متقدم - خبرة في المختبر</option>
                    </select>
                </div>

                <div class="login-input-group" id="schoolGroup" style="display:none;">
                    <input type="text" id="regSchool" placeholder="اسم المدرسة / المؤسسة (اختياري)" aria-label="اسم المدرسة أو المؤسسة" data-ar-aria-label="اسم المدرسة أو المؤسسة" data-en-aria-label="School or institution" data-ar-placeholder="اسم المدرسة / المؤسسة (اختياري)" data-en-placeholder="School / institution (optional)">
                </div>

                <div class="auth-error" id="authError" role="alert" aria-live="assertive" aria-atomic="true"></div>
                <button type="button" class="login-btn" id="authSubmit" data-ar="✅ إنشاء الحساب" data-en="✅ Create Account">✅ إنشاء الحساب</button>
            </div>

            <div class="auth-alt">
                <span data-ar="لديك حساب بالفعل؟" data-en="Already have an account?">لديك حساب بالفعل؟</span>
                <a href="login.html" data-ar="دخول" data-en="Sign in">دخول</a>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/core/i18n.js"></script>
    <script src="js/core/versions.js"></script>
    <script src="js/core/dataport.js"></script>
    <script src="js/core/db.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/lab/particles.js"></script>
    <script src="js/pages/auth.js"></script>
</body>
</html>
