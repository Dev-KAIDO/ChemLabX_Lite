<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس — ChemLabX 4.0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script>
        (function () {
            var t = localStorage.getItem('chemlabx_theme');
            if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
            var l = localStorage.getItem('chemlabx_lang') || 'ar';
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>
</head>
<body>
    <div id="site-nav"></div>

    <div class="app-wrapper">
        <main class="lessons-page" id="lessonsRoot"></main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/core/i18n.js"></script>
    <script src="js/core/versions.js"></script>
    <script src="js/core/dataport.js"></script>
    <script src="js/core/db.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/pages/lessons.js"></script>
</body>
</html>
