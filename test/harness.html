<!DOCTYPE html>
<html lang="en">
<head>

<title>ChemLabX TASK-003/004 Verification Harness</title>
<style>
  body { font-family: Consolas, monospace; background: #0d1117; color: #c9d1d9; margin: 24px; }
  h1 { font-size: 18px; color: #58a6ff; }
  .test { padding: 4px 0; border-bottom: 1px solid #21262d; }
  .pass { color: #3fb950; } .fail { color: #f85149; } .skip { color: #d29922; }
  .detail { color: #8b949e; font-size: 12px; }
  #summary { margin-top: 16px; padding: 10px; border: 1px solid #30363d; }
</style>

<body>
<h1>ChemLabX TASK-003/004 Verification Harness</h1>
<div id="results"></div>
<div id="summary"></div>

<script>
/* ============================================================
   SEED the legacy localStorage state BEFORE any app scripts run,
   so the compat layer + migration see a realistic pre-TASK-003 state.
   A run-unique marker distinguishes "fresh migration copied these keys"
   from "migration reused, keys written afterwards via write-through".
   ============================================================ */
(function () {
    var runId = 'r' + Date.now();
    var records = {
        'chemlabx_legacy_marker': { migratedLegacy: true, note: 'pre-existing key' },
        'chemlabx_legacy_notes': { lessonId: 3, note: 'historical row without provenance' }
    };
    records['chemlabx_run_marker_' + runId] = { runId: runId };
    for (var k in records) {
        if (Object.prototype.hasOwnProperty.call(records, k)) {
            window.localStorage.setItem(k, JSON.stringify(records[k]));
        }
    }
    window.__HARNESS_RUN_ID__ = runId;
})();
</script>

<script src="../js/core/i18n.js"></script>
<script src="../js/core/versions.js"></script>
<script src="../js/core/dataport.js"></script>
<script src="../js/core/db.js"></script>
<script src="../js/core/auth.js"></script>
<script src="../js/domain/authorization.js"></script>
<script src="../js/data/materials.js"></script>
<script src="../js/data/reactions.js"></script>
<script src="../js/data/achievements.js"></script>
<script src="../js/domain/chemistry.js"></script>
<script src="../js/domain/laboratory.js"></script>
    <script src="../js/domain/safety.js"></script>
    <script src="../js/domain/results.js"></script>
    <script src="../js/domain/changejournal.js"></script>
    <script src="../js/lab/engine.js"></script>
    <script src="../js/pages/experiments.js"></script>
    <script src="../js/domain/content.js"></script>
    <script src="../js/data/content/manifest.js"></script>
    <script src="../js/data/content/lessons.js"></script>
    <script src="../js/data/content/quiz.js"></script>
    <script src="../js/data/content/experiments.js"></script>
    <script src="../js/domain/education.js"></script>

<script>
(function () {
    'use strict';

    var results = [];
    var errors = [];
    var runtimeErrors = [];
    window.addEventListener('error', function (e) { runtimeErrors.push(String(e.message || e.error)); });
    window.addEventListener('unhandledrejection', function (e) { runtimeErrors.push('rejection: ' + String(e && e.reason)); });

    /* Keep virtual time occupied so real IndexedDB I/O always gets
       event-loop turns before --dump-dom captures the page. */
    var keepalive = setInterval(function () {}, 1);

    function record(id, name, pass, detail) {
        results.push({ id: id, name: name, pass: pass, detail: detail || '' });
        render();
    }
    function render() {
        var box = document.getElementById('results');
        box.innerHTML = results.map(function (r) {
            return '<div class="test ' + (r.pass ? 'pass' : 'fail') + '">' +
                '<b>[' + r.id + ']</b> ' + r.name + ' — ' + (r.pass ? 'PASS' : 'FAIL') +
                (r.detail ? ' <span class="detail">' + r.detail + '</span>' : '') + '</div>';
        }).join('');
        var pass = results.filter(function (r) { return r.pass; }).length;
        var fail = results.length - pass;
        var sum = document.getElementById('summary');
        sum.innerHTML = '<b>SUMMARY:</b> ' + pass + ' PASS / ' + fail + ' FAIL / ' + results.length + ' TOTAL' +
            (runtimeErrors.length ? ' <span class="fail">| runtimeErrors: ' + runtimeErrors.length + ' (see stderr/console)</span>' : '') +
            '<br>' + JSON.stringify({ pass: pass, fail: fail, total: results.length, runtimeErrors: runtimeErrors.length, tests: results });
    }

    function waitFor(fn, timeout, label) {
        return new Promise(function (resolve, reject) {
            var t0 = Date.now();
            (function poll() {
                var r;
                try { r = fn(); } catch (e) { return reject(e); }
                if (r) return resolve(r);
                if (Date.now() - t0 > (timeout || 8000)) return reject(new Error('timeout' + (label ? ' (' + label + ')' : '')));
                setTimeout(poll, 50);
            })();
        });
    }

    async function fetchText(url) {
        var res = await fetch(url);
        return { status: res.status, text: await res.text() };
    }

    async function run() {
        /* ---- A. Migration ---- */
        try {
            var runId = window.__HARNESS_RUN_ID__;
            var runMarkerKey = 'chemlabx_run_marker_' + runId;
            var runMarkerValue = { runId: runId };
            await waitFor(function () {
                return window.DataPort &&
                    window.DataPort.status().ready &&
                    (window.DataPort.status().migrated === true || window.DataPort.status().failures.length > 0);
            }, 15000, 'dataPort ready + migration settled');
            var st = window.DataPort.status();
            record('A1', 'Migration completed (IndexedDB)', st.migrated === true, 'migrated=' + st.migrated + ' integrity=' + String(st.integrity));
            record('A2', 'Migration health OK (no silent failure)', st.health === 'ok', 'health=' + st.health + ' lastError=' + String(st.lastError));

            await window.DataPort.ensureMigrated(); /* ensure settled */
            var migrations = await window.DataPort.meta.get('migrations');
            var schema = await window.DataPort.meta.get('dbSchemaVersion');
            var lastAt = await window.DataPort.meta.get('lastMigratedAt');
            record('A3', 'Migration record persisted (steps/schema/timestamp)',
                Array.isArray(migrations) && migrations.indexOf('v1') !== -1 && schema === 2 && !!lastAt,
                'steps=' + JSON.stringify(migrations) + ' dbSchemaVersion=' + String(schema));

            var markerLocal = JSON.parse(window.localStorage.getItem('chemlabx_legacy_marker') || 'null');
            var markerIdb = await window.DataPort.get('chemlabx_legacy_marker');
            var copiedOk = markerLocal && markerIdb && JSON.stringify(markerLocal) === JSON.stringify(markerIdb);
            if (!copiedOk && window.DataPort.status().migrated) {
                /* Reused profile: keys written after the original migration are only
                   expected in IndexedDB once the write-through path forwards them. */
                await window.DataPort.set(runMarkerKey, runMarkerValue);
                var runMarkerIdb = await window.DataPort.get(runMarkerKey);
                copiedOk = runMarkerIdb && JSON.stringify(runMarkerValue) === JSON.stringify(runMarkerIdb);
                record('A4', 'Legacy key integrity: copy (fresh) or write-through (reused)', copiedOk,
                    'copy=' + (copiedOk && markerIdb ? JSON.stringify(markerLocal) : 'n/a') + ' runKeyInIdb=' + (copiedOk && runMarkerIdb ? 'yes' : 'no'));
            } else {
                record('A4', 'Legacy key integrity: copied identical to IndexedDB', copiedOk,
                    'local=' + JSON.stringify(markerLocal) + ' idb=' + JSON.stringify(markerIdb));
            }

            var usersLocal = JSON.parse(window.localStorage.getItem('chemlabx_users') || '{}');
            var usersIdb = await window.DataPort.get('chemlabx_users');
            record('A5', 'Integrity: seeded chemlabx_users copied identically',
                usersLocal && usersIdb && JSON.stringify(usersLocal) === JSON.stringify(usersIdb),
                'localKeys=' + Object.keys(usersLocal).length + ' idbKeys=' + Object.keys(usersIdb || {}).length);

            record('A6', 'Migration is NON-DESTRUCTIVE (localStorage preserved)',
                !!window.localStorage.getItem('chemlabx_legacy_marker') && !!window.localStorage.getItem('chemlabx_users'),
                'localStorage keys still present');

            var again = await window.DataPort.ensureMigrated();
            record('A7', 'Migration idempotent (re-run reused)', again.reused === true, JSON.stringify(again));

            var after = window.DataPort.status();
            record('A8', 'No IndexedDB failures recorded', after.failures.length === 0,
                'failures=' + after.failures.length + ' pendingWrites=' + after.pendingWrites);
        } catch (e) {
            record('A', 'Migration suite FAILED', false, String(e));
        }

        /* ---- B. IndexedDB DataPort ---- */
        try {
            await window.DataPort.set('chemlabx_test_roundtrip', { hello: 'idb', n: 42 });
            var got = await window.DataPort.get('chemlabx_test_roundtrip');
            record('B1', 'IndexedDB write/read round-trip', got && got.hello === 'idb' && got.n === 42, JSON.stringify(got));

            var keys = await window.DataPort.list();
            record('B2', 'IndexedDB list() includes written keys',
                keys.indexOf('chemlabx_test_roundtrip') !== -1 && keys.indexOf('chemlabx_users') !== -1,
                'count=' + keys.length);

            var cs = window.CHLDB.storageStatus();
            record('B3', 'Status observable via CHLDB.storageStatus()',
                cs && cs.dataPort && cs.transitional === true && cs.mirror,
                JSON.stringify({ transitional: cs.transitional, mirror: cs.mirror.health, idb: cs.dataPort.health }));
        } catch (e) {
            record('B', 'IndexedDB suite FAILED', false, String(e));
        }

        /* ---- C. CHLDB compatibility layer ---- */
        try {
            var all = window.CHLDB.users.all();
            var emails = Object.keys(all).map(function (k) { return all[k].email; });
            record('C1', 'CHLDB seed accounts present (compat cache)',
                emails.indexOf('admin@chemlabx.com') !== -1 && emails.indexOf('student@chemlabx.com') !== -1,
                emails.join(', '));

            var before = window.CHLDB.get('test_c', 'none');
            window.CHLDB.set('test_c', { v: 1 });
            var after2 = window.CHLDB.get('test_c', 'none');
            var localC = JSON.parse(window.localStorage.getItem('chemlabx_test_c') || 'null');
            var idbC = await window.DataPort.get('chemlabx_test_c');
            record('C2', 'CHLDB.set writes cache + localStorage mirror + IndexedDB',
                after2 && after2.v === 1 && localC && localC.v === 1 && idbC && idbC.v === 1,
                'cache=' + (after2 && after2.v) + ' ls=' + (localC && localC.v) + ' idb=' + (idbC && idbC.v));
        } catch (e) {
            record('C', 'Compatibility suite FAILED', false, String(e));
        }

        /* ---- D. Provenance ---- */
        try {
            var nid = 'prov_new_' + Date.now();
            var row = window.CHLDB.submissions.upsert(nid, { assignmentId: 'a1', status: 'completed' });
            var p = row.provenance;
            record('D1', 'NEW submission stamped with provenance (7 keys, one shape)',
                !!p && p.appVersion === '4.0.0-foundation' && p.schemaVersion === 2 &&
                !!p.contentVersion && !!p.chemistryDataVersion && !!p.engineVersion &&
                !!p.safetyModelVersion && !!p.savedAt,
                p ? JSON.stringify(p) : 'no provenance');

            var oid = 'prov_old_' + Date.now();
            var c = window.CHLDB.submissions.all();
            c[oid] = { assignmentId: 'a9', status: 'submitted', submittedAt: 1700000000000 }; /* old row, no provenance */
            window.CHLDB.submissions.save(c); /* simulate historical record */
            var updated = window.CHLDB.submissions.upsert(oid, { assignmentId: 'a9', status: 'graded' });
            record('D2', 'OLD historical record NEVER mutated to add provenance',
                !updated.provenance, 'provenance=' + JSON.stringify(updated.provenance));

            var existing = window.CHLDB.submissions.getById(updated.id || oid);
            record('D3', 'Stored old record still lacks provenance',
                !!existing && !existing.provenance, 'present=' + !!existing);
        } catch (e) {
            record('D', 'Provenance suite FAILED', false, String(e));
        }

        /* ---- E. Fail-closed reactions ---- */
        try {
            var unknown = window.Lab.engine.findReaction(['Cu', 'Zn']);
            record('E1', 'Unmatched mix resolves to null (unknown-result), never default',
                unknown === null, 'result=' + JSON.stringify(unknown));

            var known = window.Lab.engine.findReaction(['Na', 'H2O']);
            record('E2', 'Validated mix still resolves',
                known !== null && known.equation, known ? (known.equation || 'no equation') : 'null');

            var engineSrc = await fetchText('/js/lab/engine.js');
            record('E3', 'engine.js contains explicit unknown-result handling',
                engineSrc.text.indexOf("unknown-result") !== -1 && engineSrc.text.indexOf("not-in-validated-dataset") !== -1,
                '');

            record('E4', 'engine.js no longer falls back to reactions[default]',
                engineSrc.text.indexOf("reactions['default']") === -1 && engineSrc.text.indexOf("reactions[\"default\"]") === -1, '');
        } catch (e) {
            record('E', 'Fail-closed suite FAILED', false, String(e));
        }

        /* ---- F. Safety achievements ---- */
        try {
            var ids = window.achievementDB.map(function (a) { return a.id; });
            record('F1', 'New safe achievements present',
                ids.indexOf('valid_experiment') !== -1 && ids.indexOf('safety_response') !== -1 && ids.indexOf('measurements') !== -1,
                ids.join(', '));
            record('F2', 'Danger rewards removed',
                ids.indexOf('danger_zone') === -1 && ids.indexOf('three_danger') === -1 && ids.indexOf('temp_80') === -1,
                '');

            /* Lab.state + helpers live in js/lab/lab.js (lab page controller, not loaded
               here). Provide minimal engine-facing stubs so checkAchievements() can run. */
            window.Lab.state = {
                xp: 0, experimentCount: 0, validExperiments: 0, dangerousReactions: 0,
                toolsUsed: {}, unlockedAchievements: {}, experimentsDone: [],
                highTempWarning: false, cooledAfterWarning: false, measurementsTaken: false
            };
            window.Lab.toast = function () {};
            window.Lab.addLog = function () {};
            window.Lab.updateUI = function () {};
            window.Lab.saveProgress = function () {};
            window.Lab.addXP = function () {};
            window.Lab.state.measurementsTaken = true;
            window.Lab.engine.checkAchievements();
            window.Lab.state.validExperiments = 1;
            window.Lab.engine.checkAchievements();
            window.Lab.state.highTempWarning = true;
            window.Lab.state.cooledAfterWarning = true;
            window.Lab.engine.checkAchievements();
            var ua = window.Lab.state.unlockedAchievements;
            record('F3', 'valid_experiment / safety_response / measurements award correctly',
                ua['valid_experiment'] === true && ua['safety_response'] === true && ua['measurements'] === true,
                JSON.stringify({ valid_experiment: ua['valid_experiment'], safety_response: ua['safety_response'], measurements: ua['measurements'] }));
        } catch (e) {
            record('F', 'Achievements suite FAILED', false, String(e));
        }

        /* ---- G. Dead-code cleanup (HTTP-level) ---- */
        try {
            var legacyPaths = ['/js/app.js', '/js/data.js', '/js/quiz.js', '/css/style.css'];
            for (var i = 0; i < legacyPaths.length; i++) {
                var resp = await fetchText(legacyPaths[i]);
                (function (p, s) {
                    record('G1_' + i, 'Legacy deleted: 404 for ' + p, s === 404, 'status=' + s);
                })(legacyPaths[i], resp.status);
            }

            var pages = ['index.html', 'login.html', 'register.html', 'dashboard.html', 'lab.html', 'experiments.html', 'lessons.html', 'quiz.html', 'profile.html', 'admin.html'];
            for (var j = 0; j < pages.length; j++) {
                var pr = await fetchText('/' + pages[j]);
                var hasVersions = pr.text.indexOf('js/core/versions.js') !== -1;
                var hasDataPort = pr.text.indexOf('js/core/dataport.js') !== -1;
                var noLegacy = pr.text.indexOf('js/app.js') === -1 && pr.text.indexOf('js/data.js') === -1 && pr.text.indexOf('js/quiz.js') === -1 && pr.text.indexOf('css/style.css') === -1;
                (function (p, a, b, c) {
                    record('G2_' + j, 'Page ' + p + ' loads versions+dataport, no legacy refs',
                        a && b && c, 'versions=' + a + ' dataport=' + b + ' noLegacy=' + c);
                })(pages[j], hasVersions, hasDataPort, noLegacy);
            }
        } catch (e) {
            record('G', 'Cleanup suite FAILED', false, String(e));
        }

        /* ---- H. TASK-004 Chemistry & Laboratory domain ---- */
        try {
            record('H1', 'Chemistry + Laboratory domain modules loaded',
                typeof window.Chemistry === 'object' && typeof window.Chemistry.determine === 'function' &&
                typeof window.Laboratory === 'object' && typeof window.Laboratory.normalizeState === 'function', '');

            var chem = window.Chemistry;
            var lab = window.Laboratory;
            var dv = window.CHL.versions.CHEMISTRY_DATA_VERSION;
            var ev = window.CHL.versions.ENGINE_VERSION;

            var comboChecks = 0;
            var expectedResolved = 0;
            var unmatchedNotes = [];
            Object.keys(window.Lab.engine.experiments).forEach(function (id) {
                var mats = window.Lab.engine.experiments[id];
                var r = chem.determine({ materials: mats.map(function (m) { return { id: m }; }), temperature: 25, ph: 7 }, dv, ev);
                if (chem.lookupReaction(mats)) {
                    expectedResolved++;
                    if (r.status === 'resolved' && r.products.length >= 1 && r.reaction && r.reaction.equation) comboChecks++;
                    else unmatchedNotes.push(id + '=WRONG(' + r.status + ')');
                } else {
                    if (r.status === 'unknown-result' && r.reason === 'not-in-validated-dataset') unmatchedNotes.push(id + '=unknown(fail-closed OK, no record)');
                    else unmatchedNotes.push(id + '=WRONG(' + r.status + ')');
                }
            });
            record('H2', 'Registry combos resolve; record-less combo fails closed (no fabrication)',
                comboChecks === expectedResolved && expectedResolved === 14,
                comboChecks + '/' + expectedResolved + ' resolved; notes: ' + (unmatchedNotes.join(', ') || 'none'));

            var pairChecks = 0;
            var pairTotals = Object.keys(window.reactions).filter(function (k) { return k !== 'default'; }).length;
            Object.keys(window.reactions).forEach(function (key) {
                if (key === 'default') return;
                var ids = key.split(',');
                var rec = chem.lookupReaction(ids);
                var r = chem.determine({ materials: ids.map(function (m) { return { id: m }; }), temperature: 25, ph: 7 }, dv, ev);
                if (rec && r.status === 'resolved' && r.reaction.id === key) pairChecks++;
            });
            record('H3', 'Every validated reaction key resolves (lookup + determine, id round-trip)',
                pairChecks === pairTotals, pairChecks + '/' + pairTotals);

            var unk = chem.determine({ materials: [{ id: 'Cu' }, { id: 'Zn' }], temperature: 25, ph: 7 }, dv, ev);
            record('H4', 'Unmatched mix -> unknown-result, reason, no products/derived/xp',
                unk.status === 'unknown-result' && unk.reason === 'not-in-validated-dataset' &&
                !unk.products && !unk.derived && !unk.reaction,
                JSON.stringify(unk));

            var input = { materials: [{ id: 'Na', qty: 5, unit: 'ml' }, { id: 'H2O', qty: 10, unit: 'ml' }], temperature: 25, ph: 7 };
            var d1 = chem.determine(input, dv, ev);
            var d2 = chem.determine(input, dv, ev);
            var stable = true;
            for (var iter = 0; iter < 10; iter++) if (JSON.stringify(chem.determine(input, dv, ev)) !== JSON.stringify(d1)) stable = false;
            record('H5', 'Determinism: identical input -> identical output (10 runs), no shared result identity',
                stable && d1 !== d2, '');

            var pk = unk.provenance, rk = d1.provenance;
            record('H6', 'Provenance stamped on resolved + unknown results (chemistry+engine versions)',
                rk.chemistryDataVersion === dv && rk.engineVersion === ev &&
                pk.chemistryDataVersion === dv && pk.engineVersion === ev &&
                !rk.savedAt,
                JSON.stringify(rk));

            var dSrc = await fetchText('/js/domain/chemistry.js');
            var lSrc = await fetchText('/js/domain/laboratory.js');
            var dirty = /document\.|window\.alert|innerHTML|Math\.random/.test(dSrc.text + lSrc.text);
            record('H7', 'Domain sources are UI-free (no document/alert/innerHTML/random)',
                !dirty && dSrc.status === 200 && lSrc.status === 200, '');

            var fakeState = {
                benchItems: [
                    { id: 'b1', material: 'Na', name: 'Sodium', formula: 'Na', color: '#C0C0C0', qty: 5, unit: 'ml', element: {} },
                    { id: 'b2', material: 'H2O', name: 'Water', formula: 'H2O', color: '#87CEEB', qty: 10, unit: 'ml', element: {} }
                ],
                temperature: 25.5, ph: 7.2
            };
            var norm = lab.normalizeState(fakeState);
            var hasDom = norm.materials.some(function (m) { return typeof m.element !== 'undefined' || typeof m.name !== 'undefined'; });
            record('H8', 'Laboratory.normalizeState strips DOM refs, emits only id/qty/unit',
                !hasDom && norm.materials.length === 2 && norm.materials[0].id === 'Na' &&
                norm.materials[0].qty === 5 && norm.temperature === 25.5 && norm.ph === 7.2,
                JSON.stringify(norm));

            var nd = chem.determine(norm, dv, ev);
            var hasQty = nd.reactants.some(function (m) { return m.id === 'Na' && m.qty === 5 && m.unit === 'ml'; });
            record('H9', 'Resolved reactants carry qty/unit from the normalized snapshot',
                hasQty && nd.status === 'resolved', JSON.stringify(nd.reactants));

            var unknownNorm = chem.determine(lab.normalizeState({ benchItems: [], temperature: 20, ph: 7 }), dv, ev);
            record('H10', 'Empty/invalid bench -> unknown-result (fail closed)',
                unknownNorm.status === 'unknown-result' && unknownNorm.reason === 'not-in-validated-dataset', '');
        } catch (e) {
            record('H', 'TASK-004 domain suite FAILED', false, String(e));
        }

        /* ---- H.2 Existing lab behavior exercised end-to-end (domain -> session) ---- */
        try {
            window.Lab.saveSnapshot = function () {};
            window.Lab.checkAchievements = function () {};
            if (typeof window.t !== 'function') window.t = function (ar, en) { return en != null ? en : ar; };
            window.Lab.state.benchItems = [{ material: 'Na' }, { material: 'H2O' }];
            window.Lab.state.temperature = 25;
            window.Lab.state.ph = 7;
            window.Lab.state.isReacting = false;
            window.Lab.state.lastResult = null;
            window.Lab.state.lastDetermination = null;
            window.Lab.state.experimentCount = 0;
            window.Lab.state.validExperiments = 0;
            window.Lab.state.experimentsDone = [];
            var hMixes = window.Lab.engine.performMix;
            for (var hi = 0; hi < 3; hi++) {
                hMixes();
                if (hi < 2) { window.Lab.state.isReacting = false; window.Lab.state.lastResult = null; window.Lab.state.lastDetermination = null; }
            }
            record('H11', 'performMix end-to-end: known mix -> ok + provenance + XP/counters (3 mixes, no throw)',
                window.Lab.state.lastResult && window.Lab.state.lastResult.status === 'ok' &&
                window.Lab.state.lastDetermination && window.Lab.state.lastDetermination.status === 'resolved' &&
                window.Lab.state.lastDetermination.provenance.chemistryDataVersion === dv &&
                window.Lab.state.experimentCount === 3 && window.Lab.state.validExperiments === 3 &&
                window.Lab.state.temperature === 25 + 45 * 3 && window.Lab.state.ph === 14,
                'lastResult=' + JSON.stringify(window.Lab.state.lastResult) +
                ' temp=' + window.Lab.state.temperature + ' ph=' + window.Lab.state.ph +
                ' experimentCount=' + window.Lab.state.experimentCount);

            window.Lab.state.benchItems = [{ material: 'Cu' }, { material: 'Zn' }];
            window.Lab.state.isReacting = false;
            window.Lab.state.lastResult = null;
            window.Lab.state.lastDetermination = null;
            window.Lab.engine.performMix();
            record('H12', 'performMix end-to-end: unmatched mix -> unknown-result, nothing awarded',
                window.Lab.state.lastResult && window.Lab.state.lastResult.status === 'unknown-result' &&
                window.Lab.state.lastResult.reason === 'not-in-validated-dataset' &&
                window.Lab.state.lastDetermination && window.Lab.state.lastDetermination.status === 'unknown-result' &&
                window.Lab.state.experimentCount === 3 && window.Lab.state.validExperiments === 3,
                'lastResult=' + JSON.stringify(window.Lab.state.lastResult) +
                ' experimentCount=' + window.Lab.state.experimentCount + ' validExperiments=' + window.Lab.state.validExperiments);
        } catch (e) {
            record('H2', 'Lab-behavior suite FAILED', false, String(e));
        }

        /* ---- S. Safety Engine (TASK-005) ---- */
        try {
            var SH = window.Safety;
            var sSrcRaw = await fetchText('/js/domain/safety.js');
