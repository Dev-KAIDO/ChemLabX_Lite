<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التجارب — ChemLabX 4.0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .experiments-page { padding: 32px 20px 60px; max-width: 1100px; margin: 0 auto; }
        .lessons-header h1 { font-size: 26px; color: var(--text-primary); }
        .lessons-header p { color: var(--text-secondary); margin-top: 6px; font-size: 14px; }
        .experiment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 22px; }
        .experiment-card { margin-bottom: 0; }
        .exp-equation { font-family: var(--font-mono); direction: ltr; text-align: left; font-size: 12px; color: var(--accent-purple); background: rgba(var(--accent-purple-rgb), 0.08); padding: 8px 12px; border-radius: 10px; margin-top: 12px; }
        .exp-xp { font-size: 12px; color: var(--accent-green); font-weight: 700; margin-top: 8px; }
        .exp-badge { position: absolute; top: 14px; right: 14px; }
    </style>
    <script>
        (function () {
            var t = localStorage.getItem('chemlabx_theme');
            if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
            var l = localStorage.getItem('chemlabx_lang') || 'ar';
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>
</head>
<body>
    <div id="site-nav"></div>

    <div class="app-wrapper">
        <main class="experiments-page" id="expRoot"></main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/core/i18n.js"></script>
    <script src="js/core/versions.js"></script>
    <script src="js/core/dataport.js"></script>
    <script src="js/core/db.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/data/materials.js"></script>
    <script src="js/data/reactions.js"></script>
    <script src="js/data/achievements.js"></script>
    <script src="js/pages/experiments.js"></script>
</body>
</html>
