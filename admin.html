<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإدارة — ChemLabX 4.0</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .admin-page { padding: 32px 20px 60px; max-width: 1000px; margin: 0 auto; }
        .admin-tabs { display: flex; gap: 10px; margin: 20px 0 18px; flex-wrap: wrap; }
        .tab-btn { background: var(--bg-card); border: 1px solid var(--glass-border); color: var(--text-secondary); padding: 10px 22px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .tab-btn.active { background: linear-gradient(135deg, var(--accent-green), var(--accent-blue)); color: var(--on-primary); border-color: transparent; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; animation: fadeUp 0.3s ease; }
        .user-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--glass-border); margin-bottom: 10px; }
        .user-row .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(var(--accent-blue-rgb), 0.15); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .user-row .uname { font-weight: 700; font-size: 14px; color: var(--text-primary); }
        .user-row .uemail { font-size: 11px; color: var(--text-secondary); direction: ltr; text-align: end; }
        .user-row .spacer { flex: 1; }
        .select-role { background: var(--bg-hover); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: 10px; padding: 6px 10px; font-size: 12px; }
        .badge-archived { font-size: 11px; color: var(--accent-red); background: rgba(var(--accent-red-rgb), 0.12); padding: 2px 10px; border-radius: 20px; }
        .mini-stat { display: inline-block; background: rgba(var(--accent-purple-rgb), 0.12); color: var(--accent-purple); font-size: 11px; font-weight: 700; padding: 3px 12px; border-radius: 20px; }
        .admin-empty { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
        .user-row > div { min-width: 0; }
        .user-row .uemail { overflow-wrap: anywhere; }
        @media (max-width: 560px) {
            .admin-page { padding: 20px 12px 40px; }
            .user-row { flex-wrap: wrap; gap: 10px; }
            .user-row .spacer { display: none; }
            .user-row .select-role { flex: 1 1 120px; }
        }
    </style>
    <script>
        (function () {
            var t = localStorage.getItem('chemlabx_theme');
            if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
            var l = localStorage.getItem('chemlabx_lang') || 'ar';
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>
</head>
<body>
    <div id="site-nav"></div>

    <div class="app-wrapper">
        <main class="admin-page" id="adminRoot"></main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/core/i18n.js"></script>
    <script src="js/core/versions.js"></script>
    <script src="js/core/dataport.js"></script>
    <script src="js/core/db.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/pages/admin.js"></script>
</body>
</html>
